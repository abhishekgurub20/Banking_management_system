<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loan Applications | Admin Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #f0f2f5; display: flex; min-height: 100vh; }
        .sidebar { width: 260px; background: #1a1a2e; color: white; display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 10; }
        .sidebar-logo { padding: 24px 20px; background: linear-gradient(135deg,#e91e63,#c2185b); text-align: center; }
        .sidebar-logo h2 { font-size: 20px; font-weight: 700; }
        .sidebar-logo span { font-size: 11px; opacity: 0.85; letter-spacing: 1.5px; text-transform: uppercase; }
        .nav-links { list-style: none; padding: 16px 0; flex: 1; }
        .nav-links li a { display: flex; align-items: center; gap: 12px; padding: 13px 24px; color: #a0a0c0; text-decoration: none; font-size: 14px; font-weight: 500; transition: all 0.2s; border-left: 3px solid transparent; }
        .nav-links li a:hover, .nav-links li a.active { background: rgba(233,30,99,0.12); color: #fff; border-left-color: #e91e63; }
        .nav-links li a .icon { font-size: 18px; width: 22px; text-align: center; }
        .sidebar-footer { padding: 16px; border-top: 1px solid #2e2e48; }
        .logout-btn { width: 100%; padding: 11px; background: #e91e63; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .logout-btn:hover { background: #c2185b; }
        .main-content { flex: 1; margin-left: 260px; display: flex; flex-direction: column; }
        .topbar { background: white; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        .topbar-title { font-size: 20px; font-weight: 700; color: #1a1a2e; }
        .content { padding: 28px 32px; }

        .toolbar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .filter-btn { padding: 8px 18px; border-radius: 20px; border: 2px solid #ddd; background: white; font-size: 13px; font-weight: 600; cursor: pointer; color: #666; transition: all 0.2s; }
        .filter-btn.active, .filter-btn:hover { border-color: #e91e63; color: #e91e63; background: #fce4ec; }

        .panel { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        thead th { background: #1a1a2e; color: #a0a0c0; padding: 12px 16px; text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.8px; font-weight: 600; }
        tbody td { padding: 13px 16px; font-size: 13px; color: #444; border-bottom: 1px solid #f5f5f5; vertical-align: middle; }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover td { background: #fafafa; }

        .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; text-transform: capitalize; }
        .badge.pending      { background: #fff8e1; color: #f57f17; }
        .badge.under_review { background: #e3f2fd; color: #1565c0; }
        .badge.approved     { background: #e8f5e9; color: #2e7d32; }
        .badge.active       { background: #e8f5e9; color: #2e7d32; }
        .badge.rejected     { background: #ffebee; color: #c62828; }
        .badge.closed       { background: #f5f5f5; color: #888; }

        .action-btns { display: flex; gap: 6px; flex-wrap: wrap; }
        .btn-sm { padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
        .btn-approve  { background: #e8f5e9; color: #2e7d32; }
        .btn-approve:hover { background: #c8e6c9; }
        .btn-review   { background: #e3f2fd; color: #1565c0; }
        .btn-review:hover { background: #bbdefb; }
        .btn-reject   { background: #ffebee; color: #c62828; }
        .btn-reject:hover { background: #ffcdd2; }
        .btn-view     { background: #f5f5f5; color: #555; }
        .btn-view:hover { background: #e0e0e0; }

        /* Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; }
        .modal-overlay.open { display: flex; }
        .modal { background: white; border-radius: 16px; padding: 32px; width: 520px; max-width: 95vw; max-height: 90vh; overflow-y: auto; }
        .modal h2 { font-size: 20px; font-weight: 700; color: #1a1a2e; margin-bottom: 6px; }
        .modal .loan-info { background: #f8f9fa; border-radius: 10px; padding: 16px; margin: 16px 0; }
        .loan-info p { font-size: 13px; color: #555; margin-bottom: 6px; }
        .loan-info p strong { color: #222; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 6px; }
        .form-group textarea { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; resize: vertical; font-family: 'Inter', sans-serif; min-height: 80px; }
        .form-group textarea:focus { border-color: #e91e63; }
        .status-select-row { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
        .status-btn { flex: 1; min-width: 100px; padding: 10px; border-radius: 8px; border: 2px solid #ddd; background: white; font-size: 13px; font-weight: 600; cursor: pointer; text-align: center; transition: all 0.2s; }
        .status-btn.sel-approve  { border-color: #4caf50; background: #e8f5e9; color: #2e7d32; }
        .status-btn.sel-review   { border-color: #2196f3; background: #e3f2fd; color: #1565c0; }
        .status-btn.sel-reject   { border-color: #f44336; background: #ffebee; color: #c62828; }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
        .btn-cancel { padding: 10px 20px; background: #f5f5f5; color: #555; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .btn-save   { padding: 10px 22px; background: #e91e63; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .btn-save:hover { background: #c2185b; }
        .msg-box { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 14px; display: none; }
        .msg-box.success { background: #e8f5e9; color: #2e7d32; display: block; }
        .msg-box.error   { background: #ffebee; color: #c62828; display: block; }
        .empty-state { text-align: center; padding: 40px; color: #bbb; font-size: 14px; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-logo">
        <h2>Kingsley Bank</h2>
        <span>Admin Portal</span>
    </div>
    <ul class="nav-links">
        <li><a href="admin-dashboard.html"><span class="icon">📊</span> Dashboard</a></li>
        <li><a href="admin-users.html"><span class="icon">👥</span> Manage Users</a></li>
        <li><a href="admin-bankers.html"><span class="icon">🏦</span> Manage Bankers</a></li>
        <li><a href="admin-loans.html" class="active"><span class="icon">💰</span> Loan Applications</a></li>
        <li><a href="admin-transactions.html"><span class="icon">💳</span> Transactions</a></li>
        <li><a href="admin-deposits.html"><span class="icon">📥</span> Deposit Approvals</a></li>
    </ul>
    <div class="sidebar-footer">
        <button class="logout-btn" onclick="logout()">🚪 Logout</button>
    </div>
</div>

<div class="main-content">
    <div class="topbar">
        <div class="topbar-title">Loan Applications</div>
    </div>
    <div class="content">
        <div class="toolbar">
            <button class="filter-btn active" onclick="setFilter('')">All</button>
            <button class="filter-btn" onclick="setFilter('pending')">⏳ Pending</button>
            <button class="filter-btn" onclick="setFilter('under_review')">🔍 Under Review</button>
            <button class="filter-btn" onclick="setFilter('approved')">✅ Approved</button>
            <button class="filter-btn" onclick="setFilter('rejected')">❌ Rejected</button>
            <button class="filter-btn" onclick="setFilter('active')">🟢 Active</button>
        </div>

        <div class="panel">
            <table>
                <thead>
                    <tr>
                        <th>Loan ID</th><th>Customer</th><th>Type</th>
                        <th>Amount</th><th>Tenure</th><th>Interest</th>
                        <th>Status</th><th>Applied</th><th>Actions</th>
                    </tr>
                </thead>
                <tbody id="loansBody">
                    <tr><td colspan="9" class="empty-state">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Review Modal -->
<div class="modal-overlay" id="reviewModal">
    <div class="modal">
        <h2>📋 Loan Review</h2>
        <div class="msg-box" id="reviewMsg"></div>
        <input type="hidden" id="review_id">
        <div class="loan-info" id="loanDetails"></div>
        <div class="form-group">
            <label>Update Status</label>
            <div class="status-select-row">
                <button class="status-btn" id="btnApprove"  onclick="selectStatus('approved')">✅ Approve</button>
                <button class="status-btn" id="btnReview"   onclick="selectStatus('under_review')">🔍 Under Review</button>
                <button class="status-btn" id="btnReject"   onclick="selectStatus('rejected')">❌ Reject</button>
            </div>
        </div>
        <div class="form-group">
            <label>Banker Notes / Remarks</label>
            <textarea id="review_notes" placeholder="Add remarks or reason..."></textarea>
        </div>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal()">Cancel</button>
            <button class="btn-save"   onclick="submitReview()">Save Decision</button>
        </div>
    </div>
</div>

<script>
    const token = localStorage.getItem('adminToken');
    if (!token) window.location.href = 'admin-login.html';

    let currentFilter = '';
    let selectedStatus = '';

    function setFilter(f) {
        currentFilter = f;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        loadLoans();
    }

    async function loadLoans() {
        const url = 'http://localhost:5000/api/admin/loans' + (currentFilter ? `?status=${currentFilter}` : '');
        try {
            const res  = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` }});
            if (res.status === 401 || res.status === 403) { logout(); return; }
            const data = await res.json();
            const tbody = document.getElementById('loansBody');
            if (!data.success || !data.loans.length) {
                tbody.innerHTML = '<tr><td colspan="9" class="empty-state">No loans found for this filter.</td></tr>';
                return;
            }
            tbody.innerHTML = data.loans.map(l => {
                const canAction = ['pending','under_review'].includes(l.status);
                return `<tr>
                    <td><strong>${l.loan_id_str}</strong></td>
                    <td>${l.full_name}<br><small style="color:#aaa;">${l.email}</small></td>
                    <td>${l.loan_type}</td>
                    <td><strong>₹${Number(l.principal_amount).toLocaleString('en-IN')}</strong></td>
                    <td>${l.tenure_years} yrs</td>
                    <td>${l.interest_rate}%</td>
                    <td><span class="badge ${l.status}">${l.status.replace('_',' ')}</span></td>
                    <td>${new Date(l.applied_at).toLocaleDateString('en-IN')}</td>
                    <td>
                        <div class="action-btns">
                            <button class="btn-sm btn-view" onclick="openReview(${JSON.stringify(l).replace(/"/g,'&quot;')})">📋 Review</button>
                        </div>
                    </td>
                </tr>`;
            }).join('');
        } catch (e) { console.error(e); }
    }

    function openReview(loan) {
        document.getElementById('review_id').value = loan.id;
        document.getElementById('review_notes').value = loan.banker_notes || '';
        selectedStatus = loan.status;
        highlightStatus(loan.status);
        document.getElementById('loanDetails').innerHTML = `
            <p><strong>Loan ID:</strong> ${loan.loan_id_str}</p>
            <p><strong>Customer:</strong> ${loan.full_name} (${loan.email})</p>
            <p><strong>Type:</strong> ${loan.loan_type}</p>
            <p><strong>Amount:</strong> ₹${Number(loan.principal_amount).toLocaleString('en-IN')}</p>
            <p><strong>Tenure:</strong> ${loan.tenure_years} years @ ${loan.interest_rate}%</p>
            <p><strong>Purpose:</strong> ${loan.purpose || 'N/A'}</p>
            <p><strong>Current Status:</strong> <span class="badge ${loan.status}">${loan.status.replace('_',' ')}</span></p>
        `;
        document.getElementById('reviewMsg').className = 'msg-box';
        document.getElementById('reviewModal').classList.add('open');
    }

    function selectStatus(s) {
        selectedStatus = s;
        highlightStatus(s);
    }

    function highlightStatus(s) {
        document.getElementById('btnApprove').className = 'status-btn' + (s === 'approved'     ? ' sel-approve' : '');
        document.getElementById('btnReview').className  = 'status-btn' + (s === 'under_review'  ? ' sel-review'  : '');
        document.getElementById('btnReject').className  = 'status-btn' + (s === 'rejected'      ? ' sel-reject'  : '');
    }

    async function submitReview() {
        const id    = document.getElementById('review_id').value;
        const notes = document.getElementById('review_notes').value;
        const msg   = document.getElementById('reviewMsg');
        if (!selectedStatus) { msg.textContent = 'Please select a status.'; msg.className = 'msg-box error'; return; }
        try {
            const res = await fetch(`http://localhost:5000/api/admin/loans/${id}/status`, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: selectedStatus, banker_notes: notes })
            });
            const data = await res.json();
            if (data.success) {
                msg.textContent = '✅ ' + data.message;
                msg.className = 'msg-box success';
                setTimeout(() => { closeModal(); loadLoans(); }, 1200);
            } else {
                msg.textContent = data.message || 'Error';
                msg.className = 'msg-box error';
            }
        } catch (e) { alert('Server error'); }
    }

    function closeModal() { document.getElementById('reviewModal').classList.remove('open'); }
    function logout() { localStorage.removeItem('adminToken'); localStorage.removeItem('adminName'); window.location.href = 'admin-login.html'; }

    document.getElementById('reviewModal').addEventListener('click', e => {
        if (e.target === document.getElementById('reviewModal')) closeModal();
    });

    loadLoans();
</script>
</body>
</html>
