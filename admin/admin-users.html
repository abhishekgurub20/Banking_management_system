<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Users | Admin Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #f0f2f5; display: flex; min-height: 100vh; }
        .sidebar { width: 260px; background: #1a1a2e; color: white; display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 10; }
        .sidebar-logo { padding: 24px 20px; background: linear-gradient(135deg,#e91e63,#c2185b); text-align: center; }
        .sidebar-logo h2 { font-size: 20px; font-weight: 700; }
        .sidebar-logo span { font-size: 11px; opacity: 0.85; letter-spacing: 1.5px; text-transform: uppercase; }
        .nav-links { list-style: none; padding: 16px 0; flex: 1; }
        .nav-links li a { display: flex; align-items: center; gap: 12px; padding: 13px 24px; color: #a0a0c0; text-decoration: none; font-size: 14px; font-weight: 500; transition: all 0.2s; border-left: 3px solid transparent; }
        .nav-links li a:hover, .nav-links li a.active { background: rgba(233,30,99,0.12); color: #fff; border-left-color: #e91e63; }
        .nav-links li a .icon { font-size: 18px; width: 22px; text-align: center; }
        .sidebar-footer { padding: 16px; border-top: 1px solid #2e2e48; }
        .logout-btn { width: 100%; padding: 11px; background: #e91e63; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .logout-btn:hover { background: #c2185b; }
        .main-content { flex: 1; margin-left: 260px; display: flex; flex-direction: column; }
        .topbar { background: white; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        .topbar-title { font-size: 20px; font-weight: 700; color: #1a1a2e; }
        .content { padding: 28px 32px; }

        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        .toolbar-left { display: flex; gap: 10px; flex-wrap: wrap; }
        .search-box { padding: 9px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; width: 220px; outline: none; }
        .search-box:focus { border-color: #e91e63; }
        .filter-select { padding: 9px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; cursor: pointer; background: white; }
        .btn-primary { padding: 9px 18px; background: #e91e63; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .btn-primary:hover { background: #c2185b; }

        .panel { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        thead th { background: #1a1a2e; color: #a0a0c0; padding: 12px 16px; text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.8px; font-weight: 600; }
        tbody td { padding: 13px 16px; font-size: 13px; color: #444; border-bottom: 1px solid #f5f5f5; }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover td { background: #fafafa; }

        .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; text-transform: capitalize; }
        .badge.active   { background: #e8f5e9; color: #2e7d32; }
        .badge.blocked  { background: #ffebee; color: #c62828; }
        .badge.inactive { background: #fff3e0; color: #e65100; }
        .badge.customer { background: #e3f2fd; color: #1565c0; }
        .badge.banker   { background: #f3e5f5; color: #6a1b9a; }
        .badge.admin    { background: #fce4ec; color: #ad1457; }
        .badge.verified { background: #e8f5e9; color: #2e7d32; }
        .badge.pending  { background: #fff8e1; color: #f57f17; }
        .badge.rejected { background: #ffebee; color: #c62828; }

        .action-btns { display: flex; gap: 6px; }
        .btn-sm { padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
        .btn-edit   { background: #e3f2fd; color: #1565c0; }
        .btn-edit:hover { background: #bbdefb; }
        .btn-block  { background: #fff3e0; color: #e65100; }
        .btn-block:hover { background: #ffe0b2; }
        .btn-unblock { background: #e8f5e9; color: #2e7d32; }
        .btn-unblock:hover { background: #c8e6c9; }
        .btn-delete { background: #ffebee; color: #c62828; }
        .btn-delete:hover { background: #ffcdd2; }

        /* Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; }
        .modal-overlay.open { display: flex; }
        .modal { background: white; border-radius: 16px; padding: 32px; width: 500px; max-width: 95vw; max-height: 90vh; overflow-y: auto; }
        .modal h2 { font-size: 20px; font-weight: 700; color: #1a1a2e; margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 6px; }
        .form-group input, .form-group select { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; font-family: 'Inter', sans-serif; }
        .form-group input:focus, .form-group select:focus { border-color: #e91e63; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
        .btn-cancel { padding: 10px 20px; background: #f5f5f5; color: #555; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .btn-save   { padding: 10px 20px; background: #e91e63; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .btn-save:hover { background: #c2185b; }
        .msg-box { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: none; }
        .msg-box.success { background: #e8f5e9; color: #2e7d32; display: block; }
        .msg-box.error   { background: #ffebee; color: #c62828; display: block; }

        .empty-state { text-align: center; padding: 40px; color: #bbb; font-size: 14px; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-logo">
        <h2>Kingsley Bank</h2>
        <span>Admin Portal</span>
    </div>
    <ul class="nav-links">
        <li><a href="admin-dashboard.html"><span class="icon">📊</span> Dashboard</a></li>
        <li><a href="admin-users.html" class="active"><span class="icon">👥</span> Manage Users</a></li>
        <li><a href="admin-bankers.html"><span class="icon">🏦</span> Manage Bankers</a></li>
        <li><a href="admin-loans.html"><span class="icon">💰</span> Loan Applications</a></li>
        <li><a href="admin-transactions.html"><span class="icon">💳</span> Transactions</a></li>
        <li><a href="admin-deposits.html"><span class="icon">📥</span> Deposit Approvals</a></li>
    </ul>
    <div class="sidebar-footer">
        <button class="logout-btn" onclick="logout()">🚪 Logout</button>
    </div>
</div>

<div class="main-content">
    <div class="topbar">
        <div class="topbar-title">User Management</div>
        <button class="btn-primary" onclick="openAddBankerModal()">+ Add Banker</button>
    </div>
    <div class="content">
        <div class="toolbar">
            <div class="toolbar-left">
                <input type="text" class="search-box" id="searchInput" placeholder="🔍 Search name, email..." oninput="loadUsers()">
                <select class="filter-select" id="roleFilter" onchange="loadUsers()">
                    <option value="">All Roles</option>
                    <option value="customer">Customer</option>
                    <option value="banker">Banker</option>
                    <option value="admin">Admin</option>
                </select>
                <select class="filter-select" id="statusFilter" onchange="loadUsers()">
                    <option value="">All Status</option>
                    <option value="active">Active</option>
                    <option value="blocked">Blocked</option>
                    <option value="inactive">Inactive</option>
                </select>
            </div>
        </div>

        <div class="panel">
            <table>
                <thead>
                    <tr>
                        <th>ID</th><th>Name</th><th>Email</th><th>Mobile</th>
                        <th>Role</th><th>KYC</th><th>Status</th><th>Actions</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <tr><td colspan="8" class="empty-state">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Add Banker Modal -->
<div class="modal-overlay" id="addBankerModal">
    <div class="modal">
        <h2>➕ Add New Banker</h2>
        <div class="msg-box" id="bankerMsg"></div>
        <div class="form-row">
            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" id="b_fullName" placeholder="John Smith">
            </div>
            <div class="form-group">
                <label>Username *</label>
                <input type="text" id="b_username" placeholder="johnsmith">
            </div>
        </div>
        <div class="form-group">
            <label>Email *</label>
            <input type="email" id="b_email" placeholder="john@kingsleybank.com">
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Mobile *</label>
                <input type="text" id="b_mobile" placeholder="+91 9999999999">
            </div>
            <div class="form-group">
                <label>Password *</label>
                <input type="password" id="b_password" placeholder="Min 6 characters">
            </div>
        </div>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal('addBankerModal')">Cancel</button>
            <button class="btn-save" onclick="addBanker()">Create Banker Account</button>
        </div>
    </div>
</div>

<!-- Edit User Modal -->
<div class="modal-overlay" id="editUserModal">
    <div class="modal">
        <h2>✏️ Edit User</h2>
        <div class="msg-box" id="editMsg"></div>
        <input type="hidden" id="edit_id">
        <div class="form-row">
            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" id="edit_fullName">
            </div>
            <div class="form-group">
                <label>Mobile *</label>
                <input type="text" id="edit_mobile">
            </div>
        </div>
        <div class="form-group">
            <label>Email *</label>
            <input type="email" id="edit_email">
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Role</label>
                <select id="edit_role">
                    <option value="customer">Customer</option>
                    <option value="banker">Banker</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <div class="form-group">
                <label>Status</label>
                <select id="edit_status">
                    <option value="active">Active</option>
                    <option value="inactive">Inactive</option>
                    <option value="blocked">Blocked</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label>KYC Status</label>
            <select id="edit_kyc">
                <option value="pending">Pending</option>
                <option value="verified">Verified</option>
                <option value="rejected">Rejected</option>
            </select>
        </div>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal('editUserModal')">Cancel</button>
            <button class="btn-save" onclick="saveEdit()">Save Changes</button>
        </div>
    </div>
</div>

<script>
    const token = localStorage.getItem('adminToken');
    if (!token) window.location.href = 'admin-login.html';

    async function loadUsers() {
        const search = document.getElementById('searchInput').value;
        const role   = document.getElementById('roleFilter').value;
        const status = document.getElementById('statusFilter').value;
        let url = 'http://localhost:5000/api/admin/users?';
        if (search) url += `search=${encodeURIComponent(search)}&`;
        if (role)   url += `role=${role}&`;
        if (status) url += `status=${status}&`;

        try {
            const res  = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` }});
            if (res.status === 401 || res.status === 403) { logout(); return; }
            const data = await res.json();
            const tbody = document.getElementById('userTableBody');
            if (!data.success || !data.users.length) {
                tbody.innerHTML = '<tr><td colspan="8" class="empty-state">No users found.</td></tr>';
                return;
            }
            tbody.innerHTML = data.users.map(u => `
                <tr>
                    <td>${u.id}</td>
                    <td><strong>${u.full_name}</strong><br><small style="color:#aaa;">${u.username}</small></td>
                    <td>${u.email}</td>
                    <td>${u.mobile || '—'}</td>
                    <td><span class="badge ${u.role}">${u.role}</span></td>
                    <td><span class="badge ${u.kyc_status || 'pending'}">${u.kyc_status || 'pending'}</span></td>
                    <td><span class="badge ${u.status}">${u.status}</span></td>
                    <td>
                        <div class="action-btns">
                            <button class="btn-sm btn-edit" onclick="openEditModal(${u.id})">✏️ Edit</button>
                            ${u.status === 'blocked'
                                ? `<button class="btn-sm btn-unblock" onclick="toggleStatus(${u.id},'active')">✅ Unblock</button>`
                                : `<button class="btn-sm btn-block" onclick="toggleStatus(${u.id},'blocked')">🚫 Block</button>`}
                            <button class="btn-sm btn-delete" onclick="deleteUser(${u.id}, '${u.full_name}')">🗑️</button>
                        </div>
                    </td>
                </tr>`).join('');
        } catch (e) {
            console.error(e);
        }
    }

    async function toggleStatus(id, status) {
        if (!confirm(`Change user status to "${status}"?`)) return;
        try {
            const res = await fetch(`http://localhost:5000/api/admin/users/${id}/status`, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ status })
            });
            const data = await res.json();
            if (data.success) loadUsers();
            else alert(data.message);
        } catch (e) { alert('Error updating status'); }
    }

    async function deleteUser(id, name) {
        if (!confirm(`Delete user "${name}"? This cannot be undone!`)) return;
        try {
            const res = await fetch(`http://localhost:5000/api/admin/users/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            if (data.success) loadUsers();
            else alert(data.message);
        } catch (e) { alert('Error deleting user'); }
    }

    async function openEditModal(id) {
        try {
            const res = await fetch(`http://localhost:5000/api/admin/users/${id}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            if (!data.success) { alert('Failed to load user'); return; }
            const u = data.user;
            document.getElementById('edit_id').value      = u.id;
            document.getElementById('edit_fullName').value = u.full_name;
            document.getElementById('edit_email').value   = u.email;
            document.getElementById('edit_mobile').value  = u.mobile;
            document.getElementById('edit_role').value    = u.role;
            document.getElementById('edit_status').value  = u.status;
            document.getElementById('edit_kyc').value     = u.kyc_status;
            document.getElementById('editMsg').className  = 'msg-box';
            document.getElementById('editUserModal').classList.add('open');
        } catch (e) { alert('Error'); }
    }

    async function saveEdit() {
        const id = document.getElementById('edit_id').value;
        const body = {
            full_name:  document.getElementById('edit_fullName').value,
            email:      document.getElementById('edit_email').value,
            mobile:     document.getElementById('edit_mobile').value,
            role:       document.getElementById('edit_role').value,
            status:     document.getElementById('edit_status').value,
            kyc_status: document.getElementById('edit_kyc').value
        };
        try {
            const res = await fetch(`http://localhost:5000/api/admin/users/${id}`, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await res.json();
            const msg = document.getElementById('editMsg');
            if (data.success) {
                msg.textContent = '✅ User updated successfully!';
                msg.className = 'msg-box success';
                setTimeout(() => { closeModal('editUserModal'); loadUsers(); }, 1200);
            } else {
                msg.textContent = data.message || 'Update failed';
                msg.className = 'msg-box error';
            }
        } catch (e) { alert('Error saving'); }
    }

    function openAddBankerModal() {
        ['b_fullName','b_username','b_email','b_mobile','b_password'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('bankerMsg').className = 'msg-box';
        document.getElementById('addBankerModal').classList.add('open');
    }

    async function addBanker() {
        const body = {
            fullName: document.getElementById('b_fullName').value,
            username: document.getElementById('b_username').value,
            email:    document.getElementById('b_email').value,
            mobile:   document.getElementById('b_mobile').value,
            password: document.getElementById('b_password').value
        };
        const msg = document.getElementById('bankerMsg');
        try {
            const res = await fetch('http://localhost:5000/api/admin/add-banker', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await res.json();
            if (data.success) {
                msg.textContent = '✅ Banker account created!';
                msg.className = 'msg-box success';
                setTimeout(() => { closeModal('addBankerModal'); loadUsers(); }, 1200);
            } else {
                msg.textContent = data.message || 'Failed to create banker';
                msg.className = 'msg-box error';
            }
        } catch (e) { alert('Server error'); }
    }

    function closeModal(id) { document.getElementById(id).classList.remove('open'); }
    function logout() { localStorage.removeItem('adminToken'); localStorage.removeItem('adminName'); window.location.href = 'admin-login.html'; }

    // Close modal on outside click
    document.querySelectorAll('.modal-overlay').forEach(el => {
        el.addEventListener('click', e => { if (e.target === el) el.classList.remove('open'); });
    });

    loadUsers();
</script>
</body>
</html>
